name: Documentation

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "build_documentation_site.py"
      - "mooblender/blender_manifest.toml"
      - "tests/test_documentation*.py"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published vN.N.N release to document; leave empty for /dev"
        required: false
        type: string

permissions:
  contents: read

# Every publication updates the same persistent branch, so releases and main
# builds must never race while they preserve and replace separate directories.
concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/requirements.txt
      - name: Build documentation with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Upload rendered documentation
        if: github.event_name == 'release' || inputs.release_tag != '' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: rendered-documentation
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Assemble versioned site
    if: github.event_name == 'release' || inputs.release_tag != '' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download rendered documentation
        uses: actions/download-artifact@v8
        with:
          name: rendered-documentation
          path: .documentation-html
      - name: Restore persistent documentation tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          if git ls-remote --exit-code origin refs/heads/docs-site; then
            git clone --depth 1 --branch docs-site "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .documentation-site
          else
            mkdir .documentation-site
            git -C .documentation-site init
            git -C .documentation-site checkout --orphan docs-site
            git -C .documentation-site remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          fi
      - name: Update development documentation
        if: github.event_name != 'release' && inputs.release_tag == ''
        run: >-
          python build_documentation_site.py
          --built .documentation-html
          --site .documentation-site
          --channel dev
      - name: Update release documentation
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: >-
          python build_documentation_site.py
          --built .documentation-html
          --site .documentation-site
          --channel release
          --release-tag "$RELEASE_TAG"
          --manifest mooblender/blender_manifest.toml
      - name: Save persistent documentation tree
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          git -C .documentation-site config user.name "github-actions[bot]"
          git -C .documentation-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .documentation-site add --all
          if ! git -C .documentation-site diff --cached --quiet; then
            git -C .documentation-site commit -m "docs: publish ${RELEASE_TAG:-dev}"
            git -C .documentation-site push origin HEAD:docs-site
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare deployment artifact
        run: rsync --archive --delete --exclude .git .documentation-site/ .pages-artifact/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-artifact
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'release' || inputs.release_tag != '' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5

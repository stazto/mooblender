name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Ruff
        run: python -m pip install ruff==0.15.22
      - name: Lint
        run: ruff check --output-format=github .

  live-mooble:
    name: Mooble API health check
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 5
    env:
      MOOBLENDER_LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check the public Mooble catalog once
        run: python -m unittest tests.test_mooble_live -v

  package:
    name: Build Blender add-on
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build deterministic extension archive
        env:
          MOOBLENDER_GIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python build_blender_addon.py
      - name: Upload Blender add-on
        uses: actions/upload-artifact@v7
        with:
          name: mooblender-addon
          path: dist/mooblender-*.zip
          archive: false
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Rebuild verified tag archive
        env:
          MOOBLENDER_GIT_TAG: ${{ github.ref_name }}
        run: python build_blender_addon.py
      - name: Create development prerelease
        if: ${{ contains(github.ref_name, '-dev') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mooblender-*.zip --verify-tag --generate-notes --prerelease
      - name: Create stable release
        if: ${{ !contains(github.ref_name, '-dev') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mooblender-*.zip --verify-tag --generate-notes

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "D"]
ignore = ["D102", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "C901"]

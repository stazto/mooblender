name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Ruff
        run: python -m pip install ruff==0.15.22
      - name: Lint
        run: ruff check --output-format=github .

  live-mooble:
    name: Mooble API health check
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 5
    env:
      MOOBLENDER_LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check the public Mooble catalog once
        run: python -m unittest tests.test_mooble_live -v

  blender-lts:
    name: Blender ${{ matrix.blender-version }} integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender-version: "4.5.0"
            release-directory: Blender4.5
          - blender-version: "5.2.0"
            release-directory: Blender5.2
    steps:
      - uses: actions/checkout@v6
      - name: Restore Blender ${{ matrix.blender-version }}
        id: blender-cache
        uses: actions/cache@v6
        with:
          path: .blender-ci
          key: blender-${{ runner.os }}-${{ runner.arch }}-${{ matrix.blender-version }}-linux-x64-v1
      - name: Download official Blender binary
        if: steps.blender-cache.outputs.cache-hit != 'true'
        env:
          BLENDER_VERSION: ${{ matrix.blender-version }}
          RELEASE_DIRECTORY: ${{ matrix.release-directory }}
        run: |
          mkdir -p .blender-ci
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/${RELEASE_DIRECTORY}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output "${RUNNER_TEMP}/blender-${BLENDER_VERSION}.tar.xz"
          tar --extract --xz --file "${RUNNER_TEMP}/blender-${BLENDER_VERSION}.tar.xz" \
            --directory .blender-ci --strip-components 1
      - name: Verify cached Blender binary
        run: .blender-ci/blender --version
      - name: Register add-on and build a test scene
        run: >-
          .blender-ci/blender --background --factory-startup
          --python-exit-code 1 --python tests/blender_smoke.py
      - name: Run named model regression cases
        run: >-
          .blender-ci/blender --background --factory-startup
          --python-exit-code 1 --python tests/blender_model_regressions.py

  package:
    name: Build Blender add-on
    runs-on: ubuntu-latest
    needs: [unit-tests, lint, blender-lts]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build deterministic extension archive
        env:
          MOOBLENDER_GIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          MOOBLENDER_DEV_BUILD: ${{ github.run_number }}
        run: python build_blender_addon.py
      - name: Upload Blender add-on
        uses: actions/upload-artifact@v7
        with:
          name: mooblender-addon
          path: dist/mooblender-*.zip
          archive: false
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Rebuild verified tag archive
        env:
          MOOBLENDER_GIT_TAG: ${{ github.ref_name }}
          MOOBLENDER_DEV_BUILD: ${{ github.run_number }}
        run: python build_blender_addon.py
      - name: Create development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mooblender-*.zip --verify-tag --generate-notes --prerelease
